<svg width="1080" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{{BRAND_COLOR}}" />
      <stop offset="100%" stop-color="#1E1E1E" />
    </linearGradient>
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg-gradient)" />
  
  <!-- Subtle Grid Pattern -->
  <path d="M0,1080 L1080,0" stroke="#ffffff" stroke-width="2" opacity="0.05" />
  <path d="M0,0 L1080,1080" stroke="#ffffff" stroke-width="2" opacity="0.05" />
  <path d="M540,0 L540,1080" stroke="#ffffff" stroke-width="2" opacity="0.05" />
  <path d="M0,540 L1080,540" stroke="#ffffff" stroke-width="2" opacity="0.05" />

  <!-- Glassmorphism Card -->
  <rect x="80" y="240" width="920" height="600" rx="40" fill="#ffffff" opacity="0.95" filter="url(#drop-shadow)" />

  <!-- Topic/Category Tag -->
  <rect x="140" y="320" width="220" height="50" rx="25" fill="{{BRAND_COLOR}}" opacity="0.15" />
  <text x="250" y="352" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="{{BRAND_COLOR}}" text-anchor="middle" letter-spacing="2">{{TOPIC}}</text>

  <!-- Main Caption -->
  <foreignObject x="140" y="420" width="800" height="300">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: Arial, sans-serif; font-size: 42px; font-weight: bold; color: #1a1a1a; line-height: 1.4; text-align: left; display: flex; align-items: center; height: 100%;">
      {{CAPTION}}
    </div>
  </foreignObject>

  <!-- Brand Bar -->
  <rect x="80" y="740" width="920" height="100" rx="0" fill="#f8f9fa" />
  <path d="M80,800 L1000,800" stroke="#e9ecef" stroke-width="2" />
  <text x="540" y="800" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#6c757d" text-anchor="middle">@{{BRAND_NAME}}</text>
  
  <!-- Decorative Dots -->
  <circle cx="140" cy="140" r="6" fill="#ffffff" opacity="0.5" />
  <circle cx="940" cy="140" r="6" fill="#ffffff" opacity="0.5" />
  <circle cx="140" cy="940" r="6" fill="#ffffff" opacity="0.5" />
  <circle cx="940" cy="940" r="6" fill="#ffffff" opacity="0.5" />
</svg>
